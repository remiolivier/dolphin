name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-auto-controller-profiles

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Accept Android SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Install required Android NDK
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "ndk;30.0.15729638"

      - name: Build debug APK
        working-directory: Source/Android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dolphin-android-debug
          path: Source/Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
